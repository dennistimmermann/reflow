; Reflow oven firmware — see CLAUDE.md for the full plan.
; Target: STM32G0B1CET (LQFP-48, 512 KB), Arduino framework (STM32Duino).

[platformio]
default_envs = reflow

[env:reflow]
platform = ststm32
board = reflow_oven
board_build.variants_dir = ${PROJECT_DIR}/variants
framework = arduino
upload_protocol = dfu
extra_scripts   = scripts/reset_to_dfu.py
debug_tool = stlink
monitor_speed = 115200

build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wno-unused-parameter
  -O2
  ; STM32duino UART Serial off (UART4 would collide with NTC on PA0). USB CDC
  ; comes from our TinyUSB-backed Serial shim instead — see src/system/tud_serial.hpp.
  -D HWSERIAL_NONE
  ; TinyUSB configuration.
  -D CFG_TUSB_MCU=OPT_MCU_STM32G0
  -D CFG_TUSB_OS=OPT_OS_NONE
  -D BOARD_TUD_RHPORT=0
  -D BOARD_TUD_MAX_SPEED=OPT_MODE_FULL_SPEED
  -D STM32G0B1xx
  -D LV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}/src
  ; Force-include so every TU sees `Serial` (TudSerial) without an explicit
  ; #include. The header is guarded for C so TinyUSB / LVGL C TUs are unaffected.
  -include ${PROJECT_DIR}/src/system/serial.hpp
  -Wl,-u,_printf_float

build_unflags =
  -std=gnu++14

; Exclude STM32duino's USBDevice library so TinyUSB owns the USB peripheral
; and our USB_UCPD1_2_IRQHandler wins the link.
lib_ignore =
  USBDevice

lib_deps =
  lvgl/lvgl@^9.2.0
  baracodadailyhealthtech/tinyusb@^0.17.0

lib_ldf_mode = chain

; One-time bootstrap: flash via STLink to install DFU-capable firmware.
; After this, use the default 'reflow' env (USB DFU) for all subsequent uploads.
[env:reflow-stlink]
platform = ststm32
board = reflow_oven
board_build.variants_dir = ${PROJECT_DIR}/variants
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags     = ${env:reflow.build_flags}
build_unflags   = ${env:reflow.build_unflags}
lib_ignore      = ${env:reflow.lib_ignore}
lib_deps        = ${env:reflow.lib_deps}
lib_ldf_mode    = ${env:reflow.lib_ldf_mode}

; Host-side unit tests for control/profile/state-machine logic.
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -O0
  -g
