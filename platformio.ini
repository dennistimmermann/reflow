; Reflow oven firmware — see CLAUDE.md for the full plan.
; Target: STM32G0B1CBT, Arduino framework (STM32Duino).

[platformio]
default_envs = reflow

[env:reflow]
platform = ststm32
board = genericSTM32G0B1CB
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wno-unused-parameter
  -O2
  -D USBCON
  -D USBD_USE_CDC
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D HAL_PCD_MODULE_ENABLED
  -D LV_CONF_PATH="${PROJECT_DIR}/src/lv_conf.h"

build_unflags =
  -std=gnu++14

lib_deps =
  lvgl/lvgl@^9.2.0

lib_ldf_mode = deep+

; Host-side unit tests for control/profile/state-machine logic.
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -O0
  -g
