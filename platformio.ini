; Reflow oven firmware — see CLAUDE.md for the full plan.
; Target: STM32G0B1CBT, Arduino framework (STM32Duino).

[platformio]
default_envs = reflow

[env:reflow]
platform = ststm32
board = nucleo_g0b1re
framework = arduino
upload_protocol = dfu
extra_scripts   = pre:scripts/reset_to_dfu.py
debug_tool = stlink
monitor_speed = 115200

build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wno-unused-parameter
  -O2
  -D USBCON
  -D USBD_USE_CDC
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D HAL_PCD_MODULE_ENABLED
  -D LV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}/src

build_unflags =
  -std=gnu++14

lib_deps =
  lvgl/lvgl@^9.2.0

lib_ldf_mode = chain

; One-time bootstrap: flash via STLink to install DFU-capable firmware.
; After this, use the default 'reflow' env (USB DFU) for all subsequent uploads.
[env:reflow-stlink]
platform = ststm32
board = nucleo_g0b1re
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags     = ${env:reflow.build_flags}
build_unflags   = ${env:reflow.build_unflags}
lib_deps        = ${env:reflow.lib_deps}
lib_ldf_mode    = ${env:reflow.lib_ldf_mode}

; Host-side unit tests for control/profile/state-machine logic.
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -O0
  -g
